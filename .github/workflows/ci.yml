name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -lockfile=readonly

      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-api, recommendation-api]
    steps:
      - uses: actions/checkout@v4

      - name: Test catalog-api
        if: matrix.service == 'catalog-api'
        working-directory: services/catalog-api
        run: |
          npm ci
          npm test

      - name: Test recommendation-api
        if: matrix.service == 'recommendation-api'
        working-directory: services/recommendation-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

  build-and-scan:
    runs-on: ubuntu-latest
    needs: [terraform, test]
    strategy:
      matrix:
        service: [frontend, catalog-api, recommendation-api]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t recipeops-${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: recipeops-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
