name: deploy-hetzner

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io/leotaxx/recipes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test catalog-api
        working-directory: services/catalog-api
        run: |
          npm ci
          npm test

      - name: Test recommendation-api
        working-directory: services/recommendation-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [frontend, catalog-api, recommendation-api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for name in HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it in GitHub repository or production environment secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -p "$HETZNER_PORT" "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" 'mkdir -p /opt/recipeops'
          scp -i ~/.ssh/hetzner -P "$HETZNER_PORT" deploy/hetzner/* deploy/hetzner/.env.example "$HETZNER_USER@$HETZNER_HOST:/opt/recipeops/"

      - name: Deploy blue/green
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_HTTP_PORT: ${{ secrets.APP_HTTP_PORT || '80' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "cd /opt/recipeops && \
             chmod +x *.sh && \
             if [ ! -f .env ]; then printf 'REGISTRY=%s\nPOSTGRES_PASSWORD=%s\nAPP_HTTP_PORT=%s\nACTIVE_COLOR=blue\nBLUE_TAG=latest\nGREEN_TAG=latest\n' '${REGISTRY}' '${POSTGRES_PASSWORD}' '${APP_HTTP_PORT}' > .env; fi && \
             echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin && \
             REGISTRY='${REGISTRY}' APP_HTTP_PORT='${APP_HTTP_PORT}' IMAGE_TAG='${IMAGE_TAG}' ./deploy.sh"
