name: cleanup-hetzner

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -p "$HETZNER_PORT" "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Cleanup deployment
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" << 'EOF'

            echo "==================================="
            echo "STOPPING ALL RECIPES CONTAINERS"
            echo "==================================="

            docker ps -aq --filter "name=recipes" | xargs -r docker rm -f || true

            echo "==================================="
            echo "REMOVING RECIPES IMAGES"
            echo "==================================="

            docker images "ghcr.io/leotaxx/recipes/*" -q | xargs -r docker rmi -f || true

            echo "==================================="
            echo "REMOVING UNUSED DOCKER RESOURCES"
            echo "==================================="

            docker system prune -af --volumes || true

            echo "==================================="
            echo "REMOVING DEPLOYMENT FILES"
            echo "==================================="

            rm -rf /opt/recipeops/* || true

            echo "==================================="
            echo "FREEING PORTS"
            echo "==================================="

            sudo lsof -t -i:80 | xargs -r kill -9 || true
            sudo lsof -t -i:3000 | xargs -r kill -9 || true
            sudo lsof -t -i:5000 | xargs -r kill -9 || true

            echo "==================================="
            echo "CLEANUP COMPLETE"
            echo "==================================="

          EOF
