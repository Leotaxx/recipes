name: cleanup-hetzner

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -p "$HETZNER_PORT" "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Nuclear cleanup server
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" << 'EOF'

            set +e

            echo "==================================="
            echo "STOPPING ALL DOCKER CONTAINERS"
            echo "==================================="

            docker ps -aq | xargs -r docker rm -f

            echo "==================================="
            echo "REMOVING ALL DOCKER IMAGES"
            echo "==================================="

            docker images -aq | xargs -r docker rmi -f

            echo "==================================="
            echo "REMOVING ALL DOCKER RESOURCES"
            echo "==================================="

            docker system prune -af --volumes

            echo "==================================="
            echo "REMOVING DEPLOYMENT FILES"
            echo "==================================="

            rm -rf /opt/recipeops/*

            echo "==================================="
            echo "FREEING COMMON PORTS"
            echo "==================================="

            lsof -t -i:80 | xargs -r kill -9 || true
            lsof -t -i:3000 | xargs -r kill -9 || true
            lsof -t -i:5000 | xargs -r kill -9 || true
            lsof -t -i:8000 | xargs -r kill -9 || true
            lsof -t -i:8080 | xargs -r kill -9 || true

            echo "==================================="
            echo "DOCKER STATUS"
            echo "==================================="

            docker ps -a || true
            docker images || true

            echo "==================================="
            echo "CLEANUP COMPLETE"
            echo "==================================="

          EOF
