- name: Full cleanup old deployment
  env:
    HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    HETZNER_USER: ${{ secrets.HETZNER_USER }}
    HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
  run: |
    ssh -i ~/.ssh/hetzner -p "$HETZNER_PORT" "$HETZNER_USER@$HETZNER_HOST" << 'EOF'

      echo "Stopping all recipeops containers..."

      docker ps -aq --filter "name=recipes" | xargs -r docker rm -f

      echo "Removing recipeops images..."

      docker images "ghcr.io/leotaxx/recipes/*" -q | xargs -r docker rmi -f

      echo "Removing unused docker resources..."

      docker system prune -af --volumes

      echo "Removing deployment folder..."

      rm -rf /opt/recipeops/*

      echo "Freeing common app ports..."

      sudo lsof -t -i:80 | xargs -r kill -9 || true
      sudo lsof -t -i:3000 | xargs -r kill -9 || true
      sudo lsof -t -i:5000 | xargs -r kill -9 || true

      echo "Cleanup complete."

    EOF
