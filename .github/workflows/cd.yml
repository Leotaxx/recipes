name: cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.15.0

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      acr_login_server: ${{ steps.tfout.outputs.acr_login_server }}
      acr_name: ${{ steps.tfout.outputs.acr_name }}
      resource_group_name: ${{ steps.tfout.outputs.resource_group_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terraform backend
        working-directory: infra/terraform
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "azurerm" {
              resource_group_name  = "${{ secrets.TF_STATE_RESOURCE_GROUP }}"
              storage_account_name = "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
              container_name       = "${{ secrets.TF_STATE_CONTAINER }}"
              key                  = "${{ secrets.TF_STATE_KEY }}"
            }
          }
          EOF

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -lockfile=readonly

      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform
        run: |
          terraform plan -out=tfplan \
            -var "environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var "postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}"

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - id: tfout
        name: Export Terraform outputs
        working-directory: infra/terraform
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: terraform
    strategy:
      matrix:
        service: [frontend, catalog-api, recommendation-api]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ needs.terraform.outputs.acr_name }}

      - name: Build and push
        run: |
          docker build \
            -t ${{ needs.terraform.outputs.acr_login_server }}/recipeops-${{ matrix.service }}:${{ github.sha }} \
            services/${{ matrix.service }}
          docker push ${{ needs.terraform.outputs.acr_login_server }}/recipeops-${{ matrix.service }}:${{ github.sha }}

      - name: Update Container App revision
        run: |
          az containerapp update \
            --resource-group ${{ needs.terraform.outputs.resource_group_name }} \
            --name ca-recipeops-${{ matrix.service }} \
            --image ${{ needs.terraform.outputs.acr_login_server }}/recipeops-${{ matrix.service }}:${{ github.sha }}
