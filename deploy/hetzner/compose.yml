name: recipeops

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recipes
    volumes:
      - recipeops_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  catalog-blue:
    image: ${REGISTRY}/catalog-api:${BLUE_TAG}
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://recipes:${POSTGRES_PASSWORD}@postgres:5432/recipes
      PGSSLMODE: disable
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["blue"]

  recommendation-blue:
    image: ${REGISTRY}/recommendation-api:${BLUE_TAG}
    restart: unless-stopped
    environment:
      PORT: 3002
      CATALOG_API_URL: http://catalog-blue:3001
    depends_on:
      - catalog-blue
    profiles: ["blue"]

  frontend-blue:
    image: ${REGISTRY}/frontend:${BLUE_TAG}
    restart: unless-stopped
    environment:
      PORT: 8080
      CATALOG_API_URL: http://catalog-blue:3001
      RECOMMENDATION_API_URL: http://recommendation-blue:3002
    depends_on:
      - catalog-blue
      - recommendation-blue
    profiles: ["blue"]

  catalog-green:
    image: ${REGISTRY}/catalog-api:${GREEN_TAG}
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://recipes:${POSTGRES_PASSWORD}@postgres:5432/recipes
      PGSSLMODE: disable
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["green"]

  recommendation-green:
    image: ${REGISTRY}/recommendation-api:${GREEN_TAG}
    restart: unless-stopped
    environment:
      PORT: 3002
      CATALOG_API_URL: http://catalog-green:3001
    depends_on:
      - catalog-green
    profiles: ["green"]

  frontend-green:
    image: ${REGISTRY}/frontend:${GREEN_TAG}
    restart: unless-stopped
    environment:
      PORT: 8080
      CATALOG_API_URL: http://catalog-green:3001
      RECOMMENDATION_API_URL: http://recommendation-green:3002
    depends_on:
      - catalog-green
      - recommendation-green
    profiles: ["green"]

volumes:
  recipeops_pgdata:
